<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" width="1300" height="820" role="img" aria-label="Light City scale"><title>Light City scale</title><rect width="1300" height="820" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">Light City scale</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">From a 200-person hamlet to a town, with the spire beside familiar landmarks</text><text x="48" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1D1A15" text-anchor="start">Residents by phase</text><text x="48" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Phase 1 · Pilot Hamlet</text><rect x="48" y="256" width="24" height="36" rx="8" fill="#E9B85A"/><text x="48" y="324" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">200 · 3 domes · move-in 2031</text><text x="48" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Phase 2 · Village</text><rect x="48" y="406" width="98" height="36" rx="8" fill="#6E8B6A"/><text x="48" y="474" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">1,500–3,000 · 6–12 domes · mid-2030s</text><text x="48" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Phase 3 · Town</text><rect x="48" y="556" width="520" height="36" rx="8" fill="#B5643C"/><text x="48" y="624" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">8,000+ · 12+ domes · 2040s+</text><text x="700" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1D1A15" text-anchor="start">Height comparison</text><rect x="720" y="514.0" width="56" height="93.0" fill="#8A5F17" fill-opacity=".35"/><rect x="720" y="607.0" width="56" height="93.0" fill="#8A5F17"/><text x="748" y="500.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">60–120 m</text><text x="748" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">Light Spire</text><text x="748" y="756" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5F584C" text-anchor="middle">Phase 1</text><rect x="832" y="567.63" width="56" height="132.37" fill="#5F584C" fill-opacity="0.55"/><text x="860" y="553.63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">85.4 m</text><text x="860" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">Mjøstårnet</text><text x="860" y="756" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5F584C" text-anchor="middle">Norway</text><rect x="944" y="555.85" width="56" height="144.15" fill="#5F584C" fill-opacity="0.55"/><text x="972" y="541.85" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">93 m</text><text x="972" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">Statue</text><text x="972" y="756" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5F584C" text-anchor="middle">of Liberty</text><rect x="1056" y="235.0" width="56" height="465.0" fill="#E9B85A" fill-opacity="1"/><text x="1084" y="221.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">up to 300 m</text><text x="1084" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">Light Spire</text><text x="1084" y="756" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5F584C" text-anchor="middle">Phase 2</text><rect x="1168" y="188.5" width="56" height="511.5" fill="#5F584C" fill-opacity="0.55"/><text x="1196" y="174.5" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">330 m</text><text x="1196" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1D1A15" text-anchor="middle">Eiffel</text><text x="1196" y="756" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5F584C" text-anchor="middle">Tower</text><line x1="700" y1="700" x2="1260" y2="700" stroke="#1D1A15" stroke-width="3"/><text x="48" y="790" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start" font-style="italic">Heights drawn to scale. Light City grows only after each phase proves out.</text></svg>