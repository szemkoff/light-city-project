<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-label="Development roadmap"><title>Development roadmap</title><rect width="1300" height="640" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">Development roadmap</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">Six stages from blueprint to a living hamlet</text><line x1="110" y1="300" x2="1190" y2="300" stroke="#D8CDBA" stroke-width="6" stroke-linecap="round"/><line x1="110" y1="300" x2="272" y2="300" stroke="#8A5F17" stroke-width="6" stroke-linecap="round"/><circle cx="110" cy="300" r="30" fill="#8A5F17" stroke="#8A5F17" stroke-width="4"/><text x="110" y="309" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="110" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="middle">Foundation</text><text x="110" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8A5F17" text-anchor="middle">Oct 2025 – Dec 2026</text><text x="110" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">Documents,</text><text x="110" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">financial model,</text><text x="110" y="424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">governance</text><circle cx="326" cy="300" r="30" fill="#FBF8F2" stroke="#8A5F17" stroke-width="4"/><text x="326" y="309" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D1A15" text-anchor="middle">2</text><text x="326" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="middle">Design</text><text x="326" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#8A5F17" text-anchor="middle">Jan – Jun 2027</text><text x="326" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">Architecture,</text><text x="326" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">engineering,</text><text x="326" y="424" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">permits</text><circle cx="542" cy="300" r="30" fill="#FBF8F2" stroke="#D8CDBA" stroke-width="4"/><text x="542" y="309" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D1A15" text-anchor="middle">3</text><text x="542" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="middle">Digital</text><text x="542" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5F584C" text-anchor="middle">Jul – Nov 2027</text><text x="542" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">CRM, applications,</text><text x="542" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">community platform</text><circle cx="758" cy="300" r="30" fill="#FBF8F2" stroke="#D8CDBA" stroke-width="4"/><text x="758" y="309" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D1A15" text-anchor="middle">4</text><text x="758" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="middle">Community</text><text x="758" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5F584C" text-anchor="middle">Dec 2027 – Nov 2028</text><text x="758" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">Retreats, pilots,</text><text x="758" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">land and permits</text><circle cx="974" cy="300" r="30" fill="#FBF8F2" stroke="#D8CDBA" stroke-width="4"/><text x="974" y="309" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D1A15" text-anchor="middle">5</text><text x="974" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="middle">Physical</text><text x="974" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5F584C" text-anchor="middle">Dec 2028 – Nov 2031</text><text x="974" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">Capital raise and</text><text x="974" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">Phase 1 build</text><circle cx="1190" cy="300" r="30" fill="#FBF8F2" stroke="#D8CDBA" stroke-width="4"/><text x="1190" y="309" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1D1A15" text-anchor="middle">6</text><text x="1190" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="middle">Operational</text><text x="1190" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#5F584C" text-anchor="middle">2032 onward</text><text x="1190" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">200 residents,</text><text x="1190" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">break-even at 180</text><rect x="40" y="470" width="359" height="32" rx="16.0" fill="#F6D38C"/><text x="219.4" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1D1A15" text-anchor="middle">In progress: Stage 1, finishing</text><text x="48" y="610" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start" font-style="italic">Schedule re-baselined November 2026. Each stage passes a gate before the next begins.</text></svg>