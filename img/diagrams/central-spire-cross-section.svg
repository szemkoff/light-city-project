<text x="40" y="58" font-size="34" font-weight="bold" fill="#222">Crystal Point spire: inside plan</text>
<text x="40" y="92" font-size="19" fill="#555">Section through the tower, base hall plan and sky observatory plan. Heights in metres; the crystal is built in sections: 90 m (Phase 1), 150 m (Phase 2), 240 m (Phase 3).</text>
