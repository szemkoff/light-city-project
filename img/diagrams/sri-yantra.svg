<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img" aria-label="Sri Yantra"><title>Sri Yantra</title><rect width="1300" height="720" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">Sri Yantra</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">Nine interlocking triangles around a central point (simplified)</text><rect x="110" y="210" width="460" height="460" fill="none" stroke="#5F584C" stroke-width="3"/><circle cx="340.0" cy="440.0" r="200.0" fill="none" stroke="#8A5F17" stroke-width="3" stroke-opacity="1"/><circle cx="340.0" cy="440.0" r="170.0" fill="none" stroke="#8A5F17" stroke-width="2" stroke-opacity="1"/><polygon points="340,290 202.0,522.5 478.0,522.5" fill="none" stroke="#8A5F17" stroke-width="3"/><polygon points="340,320 229.6,506.0 450.4,506.0" fill="none" stroke="#8A5F17" stroke-width="3"/><polygon points="340,348 255.4,490.6 424.6,490.6" fill="none" stroke="#8A5F17" stroke-width="3"/><polygon points="340,376 281.1,475.2 398.9,475.2" fill="none" stroke="#8A5F17" stroke-width="3"/><polygon points="340,600 192.8,352.0 487.2,352.0" fill="none" stroke="#B5643C" stroke-width="2.5"/><polygon points="340,570 220.4,368.5 459.6,368.5" fill="none" stroke="#B5643C" stroke-width="2.5"/><polygon points="340,544 244.3,382.8 435.7,382.8" fill="none" stroke="#B5643C" stroke-width="2.5"/><polygon points="340,518 268.2,397.1 411.8,397.1" fill="none" stroke="#B5643C" stroke-width="2.5"/><polygon points="340,490 294.0,412.5 386.0,412.5" fill="none" stroke="#B5643C" stroke-width="2.5"/><circle cx="340" cy="440" r="6" fill="#8A5F17"/><rect x="680" y="170" width="572" height="230" rx="16" fill="#F3ECDF"/><text x="708" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="1.5">Traditional meaning</text><text x="708" y="252.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">A sacred diagram of Hindu and Tantric</text><text x="708" y="279.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">tradition, used as a focus for meditation.</text><text x="708" y="306.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">Four triangles point up and five point down.</text><rect x="680" y="420" width="572" height="230" rx="16" fill="#DCE5D3"/><text x="708" y="464" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6E8B6A" text-anchor="start" letter-spacing="1.5">How Light City uses it</text><text x="708" y="502.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">Inspiration for a temple floor inlay, used</text><text x="708" y="529.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">respectfully and with its cultural context</text><text x="708" y="556.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">explained. It is shown here simplified, not</text><text x="708" y="583.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">as a ritual diagram.</text></svg>