<text x="460" y="1310.6" font-size="15.5" fill="#222">Basement: batteries, grid control, pumps and heat store</text>
<line x1="358.7" y1="1276.35" x2="455" y2="1271.6" stroke="#999" stroke-width="1"/>
<text x="460" y="1276.6" font-size="15.5" fill="#222">Base hall: welcome, exhibition, meeting room (see plan)</text>
<line x1="365.797" y1="1167.15" x2="455" y2="1167.15" stroke="#999" stroke-width="1"/>
<text x="460" y="1172.15" font-size="15.5" fill="#222">Gathering level, 30 m: talks and small concerts, 120 seats</text>
<line x1="367.5548" y1="1110.6" x2="455" y2="1110.6" stroke="#999" stroke-width="1"/>
<text x="460" y="1115.6" font-size="15.5" fill="#222">Quiet level, 44 m: meditation and sound rooms</text>
<line x1="367.9684" y1="1048.2" x2="455" y2="1048.2" stroke="#999" stroke-width="1"/>
<text x="460" y="1053.2" font-size="15.5" fill="#222">Water reservoir, 58 m: gravity supply and fire water for the town</text>
<line x1="366.56780000000003" y1="991.6500000000001" x2="455" y2="991.6500000000001" stroke="#999" stroke-width="1"/>
<text x="460" y="996.6500000000001" font-size="15.5" fill="#222">Sky observatory, 72 m: enclosed, double height, café</text>
<line x1="352.5054" y1="822.0" x2="455" y2="822.0" stroke="#999" stroke-width="1"/>
<text x="460" y="827.0" font-size="15.5" fill="#222">Learning level, 118 m: weather station, climate lab, archive</text>
<line x1="350" y1="744.0" x2="455" y2="744.0" stroke="#999" stroke-width="1"/>
<text x="460" y="749.0" font-size="15.5" fill="#222">Prism hall, 138 m: light and sound art, small events</text>
<line x1="350" y1="634.8000000000001" x2="455" y2="634.8000000000001" stroke="#999" stroke-width="1"/>
<text x="460" y="639.8000000000001" font-size="15.5" fill="#222">Wind crown, 150–186 m: six helical turbines behind glass louvres, upper row turned 60°</text>
<line x1="350" y1="545.1" x2="455" y2="545.1" stroke="#999" stroke-width="1"/>
<text x="460" y="550.1" font-size="15.5" fill="#222">Star room, 190 m: stargazing and quiet evenings</text>
<line x1="350" y1="490.5" x2="455" y2="490.5" stroke="#999" stroke-width="1"/>
<text x="460" y="495.5" font-size="15.5" fill="#222">Sway damper, 204 m: a water tank that steadies the tower in wind</text>
<line x1="350" y1="412.5" x2="455" y2="412.5" stroke="#999" stroke-width="1"/>
<text x="460" y="417.5" font-size="15.5" fill="#222">Crystal point: antennas, aviation light, lightning rod</text>
<text x="40" y="140" font-size="15" fill="#444">Lift core: two public lifts, one fire and goods lift and two</text>
<text x="40" y="162" font-size="15" fill="#444">pressurised stairs; it grows with each new section.</text>
<text x="40" y="184" font-size="15" fill="#444">Between the floors the crystal is an open light atrium.</text>
<text x="40" y="206" font-size="15" fill="#444">The skin is a double layer of solar glass; warm air rises in</text>
<text x="40" y="228" font-size="15" fill="#444">the gap and draws fresh air through the halls.</text>
<text x="1560" y="152" font-size="22" font-weight="bold" fill="#222" text-anchor="middle">Base hall, ground level (about 36 m across the faces)</text>
