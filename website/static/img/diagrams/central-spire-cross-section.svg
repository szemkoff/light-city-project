etica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">programmable light at</text><text x="770" y="322.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">night</text><path d="M600 590 L760 612" stroke="#5F584C" stroke-width="1.6" fill="none"/><circle cx="600" cy="590" r="5" fill="#1D1A15"/><text x="770" y="620" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A15" text-anchor="start">Steel and timber lattice</text><text x="770" y="648.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">CLT/steel hybrid; a novel</text><text x="770" y="674.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">assembly of proven parts</text><text x="770" y="700.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">(TRL 4–5)</text><path d="M600 750 L760 814" stroke="#5F584C" stroke-width="1.6" fill="none"/><circle cx="600" cy="750" r="5" fill="#1D1A15"/><text x="770" y="822" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A15" text-anchor="start">Observation level</text><text x="770" y="850.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">Public views and a quiet</text><text x="770" y="876.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">room for sound and</text><text x="770" y="902.75" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">meditation</text><path d="M60