<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img" aria-label="Star tetrahedron (Merkaba)"><title>Star tetrahedron (Merkaba)</title><rect width="1300" height="720" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">Star tetrahedron (Merkaba)</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">Two interlocking tetrahedra, shown here in outline</text><polygon points="340.0,210.0 530.5,540.0 149.5,540.0" fill="#F6D38C" fill-opacity=".45" stroke="#8A5F17" stroke-width="4"/><polygon points="340.0,650.0 530.5,320.0 149.5,320.0" fill="#E1EAEE" fill-opacity=".45" stroke="#1D1A15" stroke-width="3"/><rect x="680" y="170" width="572" height="230" rx="16" fill="#F3ECDF"/><text x="708" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="1.5">Traditional meaning</text><text x="708" y="252.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">In some meditation traditions, the Merkaba is</text><text x="708" y="279.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">a symbol of the light body and of balance</text><text x="708" y="306.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">between opposites.</text><rect x="680" y="420" width="572" height="230" rx="16" fill="#DCE5D3"/><text x="708" y="464" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6E8B6A" text-anchor="start" letter-spacing="1.5">How Light City uses it</text><text x="708" y="502.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">A motif for the spire crown, meditation</text><text x="708" y="529.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">pavilion screens and lattice nodes. Its</text><text x="708" y="556.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">meaning is personal; no physical effect is</text><text x="708" y="583.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">claimed.</text></svg>