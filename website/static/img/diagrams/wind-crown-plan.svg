<text x="1350" y="247.0" font-size="15" text-anchor="middle" fill="#666">North</text><text x="1350" y="747.0" font-size="15" text-anchor="middle" fill="#2c5a7a">South</text>
<text x="1350" y="815" font-size="17" text-anchor="middle" fill="#222">Three turbines at the other three corners,</text>
