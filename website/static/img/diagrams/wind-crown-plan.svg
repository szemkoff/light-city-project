<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="880" viewBox="0 0 1800 880" font-family="DejaVu Sans, Arial"><rect width="1800" height="880" fill="#faf8f3"/>
<text x="40" y="56" font-size="32" font-weight="bold" fill="#222">Wind crown, 150–204 m: plan of the two turbine levels</text>
<text x="40" y="88" font-size="18" fill="#555">To scale. At the foot of the crown the twelve-sided crystal is 44 m across (61 m at the foot of the tower).</text>
<text x="40" y="112" font-size="18" fill="#555">A central mast runs up the middle. Six helical turbines, 9 m across and 18 m tall, three per level, in the open lattice.</text>
<text x="450" y="180" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">Lower level, 152–170 m</text>
<polygon points="450,259 566,290 650,374 681,490 650,606 566,690 450,721 335,690 250,606 219,490 250,374 334,290" fill="#eef3f5" stroke="#7a8f99" stroke-width="4"/>
