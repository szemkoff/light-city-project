<circle cx="526" cy="446" r="4" fill="#3f7a4b"/>
<circle cx="450" cy="578" r="47.25" fill="#d3eada" stroke="#3f7a4b" stroke-width="2.5"/>
<circle cx="450" cy="578" r="4" fill="#3f7a4b"/>
<circle cx="374" cy="446" r="47.25" fill="#d3eada" stroke="#3f7a4b" stroke-width="2.5"/>
<circle cx="374" cy="446" r="4" fill="#3f7a4b"/>
<circle cx="450" cy="490" r="16.8" fill="#b8ccd3" stroke="#5f7680" stroke-width="2"/>
<text x="450" y="524" font-size="13" text-anchor="middle" fill="#223">mast</text>
<text x="450" y="247.0" font-size="15" text-anchor="middle" fill="#666">North</text><text x="450" y="747.0" font-size="15" text-anchor="middle" fill="#2c5a7a">South</text>
<text x="450" y="815" font-size="17" text-anchor="middle" fill="#222">Three turbines at the south, north-east</text>
<text x="450" y="841" font-size="17" text-anchor="middle" fill="#222">and north-west corners</text>
<text x="1350" y="180" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">Upper level, 173–191 m</text>
<polygon points="1350,259 1466,290 1550,374 1581,490 1550,606 1466,690 1350,721 1234,690 1150,606 1119,490 1150,374 1234,290" fill="#eef3f5" stroke="#7a8f99" stroke-width="4"/>
