<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680" width="1300" height="680" role="img" aria-label="The five Platonic solids"><title>The five Platonic solids</title><rect width="1300" height="680" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">The five Platonic solids</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">The only solids whose faces are identical regular polygons</text><g transform="translate(150 280)"><polygon points="0,-60 -60,45 60,45" fill="#F6D38C" fill-opacity=".35" stroke="#8A5F17" stroke-width="3" stroke-linejoin="round"/><path d="M0 -60L10 15M-60 45L10 15L60 45" stroke="#8A5F17" stroke-width="2" stroke-opacity=".6" fill="none"/></g><text x="150" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A15" text-anchor="middle">Tetrahedron</text><text x="150" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">4 faces · fire</text><g transform="translate(400 280)"><polygon points="-45,-25 25,-25 25,50 -45,50" fill="#F6D38C" fill-opacity=".35" stroke="#8A5F17" stroke-width="3" stroke-linejoin="round"/><path d="M-45 -25L-20 -50H50L25 -25M50 -50V25L25 50" stroke="#8A5F17" stroke-width="2" stroke-opacity=".6" fill="none"/></g><text x="400" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A15" text-anchor="middle">Cube</text><text x="400" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">6 faces · earth</text><g transform="translate(650 280)"><polygon points="0,-65 55,0 0,65 -55,0" fill="#F6D38C" fill-opacity=".35" stroke="#8A5F17" stroke-width="3" stroke-linejoin="round"/><path d="M-55 0L15 10L55 0M0 -65L15 10L0 65" stroke="#8A5F17" stroke-width="2" stroke-opacity=".6" fill="none"/></g><text x="650" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A15" text-anchor="middle">Octahedron</text><text x="650" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">8 faces · air</text><g transform="translate(900 280)"><polygon points="0.0,-58.0 55.2,-17.9 34.1,46.9 -34.1,46.9 -55.2,-17.9" fill="#F6D38C" fill-opacity=".35" stroke="#8A5F17" stroke-width="3" stroke-linejoin="round"/><polygon points="0.0,30.0 -28.5,9.3 -17.6,-24.3 17.6,-24.3 28.5,9.3" fill="none" stroke="#8A5F17" stroke-width="2" stroke-opacity=".6"/></g><text x="900" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A15" text-anchor="middle">Dodecahedron</text><text x="900" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">12 faces · cosmos</text><g transform="translate(1150 280)"><polygon points="60.0,0.0 30.0,52.0 -30.0,52.0 -60.0,0.0 -30.0,-52.0 30.0,-52.0" fill="#F6D38C" fill-opacity=".35" stroke="#8A5F17" stroke-width="3" stroke-linejoin="round"/><polygon points="0.0,-34.0 29.4,17.0 -29.4,17.0" fill="none" stroke="#8A5F17" stroke-width="2" stroke-opacity=".6"/></g><text x="1150" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1D1A15" text-anchor="middle">Icosahedron</text><text x="1150" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="middle">20 faces · water</text><rect x="48" y="480" width="1204" height="150" rx="16" fill="#DCE5D3"/><text x="76" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6E8B6A" text-anchor="start" letter-spacing="1.5">How Light City uses them</text><text x="76" y="560.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">Geodesic domes are built by subdividing the icosahedron, so the communospheres literally grow from</text><text x="76" y="587.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">one of these solids. The element pairings come from Plato’s Timaeus and are used as symbolism, not</text><text x="76" y="614.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">physics.</text></svg>