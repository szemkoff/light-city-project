e cx="268.0" cy="544.7" r="72.0" fill="none" stroke="#8A5F17" stroke-width="2.5" stroke-opacity="0.8"/><circle cx="340.0" cy="420.0" r="72.0" fill="none" stroke="#8A5F17" stroke-width="2.5" stroke-opacity="0.8"/><circle cx="448.0" cy="482.4" r="72.0" fill="none" stroke="#8A5F17" stroke-width="2.5" stroke-opacity="0.8"/><circle cx="484.0" cy="420.0" r="72.0" fill="none" stroke="#8A5F17" stroke-width="2.5" stroke-opacity="0.8"/><circle cx="376.0" cy="357.6" r="72.0" fill="none" stroke="#8A5F17" stroke-width="2.5" stroke-opacity="0.8"/><circle cx="340.0" cy="295.3" r="72.0" fill="none" stroke="#8A5F17" stroke-width="2.5" stroke-opacity="0.8"/><circle cx="340.0" cy="544.7" r="72.0" fill="none" stroke="#8A5F17" stroke-width="2.5" stroke-opacity="0.8"/><rect x="680" y="170" width="572" height="230" rx="16" fill="#F3ECDF"/><text x="708" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="1.5">Traditional meaning</text><text x="708" y="252.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">Found in art from many cultures, including</text><text x="708" y="279.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">Egypt, China and Renaissance Europe; often</text><text x="708" y="306.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">read as a symbol of connection and growth.</text><rect x="680" y="420" width="572" height="230" rx="16" fill="#DCE5D3"/><text x="708" y="464" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6E8B6A" text-anchor="start" letter-spacing="1.5">How Light City uses it</text><text x="708" y="502.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">A planning grid: hexagonal spacing for paths,</text><text x="708" y="529.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">garden beds and screen patterns, and a motif</text><text x="708" y="556.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">for gates and glazing.</text></svg>