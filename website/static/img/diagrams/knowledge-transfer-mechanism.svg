<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" role="img" aria-label="Testing group learning"><title>Testing group learning</title><rect width="1300" height="640" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">Testing group learning</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">How we would study the “shared knowledge” idea from the archetype, step by step</text><defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A5F17"/></marker></defs><rect x="48" y="190" width="220" height="280" rx="16" fill="#F6D38C" stroke="#D8CDBA" stroke-width="2"/><circle cx="88" cy="232" r="20" fill="#1D1A15"/><text x="88" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="70" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="start">Question</text><text x="70" y="334.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Do groups that</text><text x="70" y="358.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">practice together</text><text x="70" y="383.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">learn faster than</text><text x="70" y="408.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">matched groups?</text><path d="M270 330 L290 330" stroke="#8A5F17" stroke-width="3" marker-end="url(#k)"/><rect x="292" y="190" width="220" height="280" rx="16" fill="#F3ECDF" stroke="#D8CDBA" stroke-width="2"/><circle cx="332" cy="232" r="20" fill="#1D1A15"/><text x="332" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="314" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="start">Pre-register</text><text x="314" y="334.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Publish</text><text x="314" y="358.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">hypothesis,</text><text x="314" y="383.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">methods and</text><text x="314" y="408.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">analysis before</text><text x="314" y="432.8" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">any data</text><path d="M514 330 L534 330" stroke="#8A5F17" stroke-width="3" marker-end="url(#k)"/><rect x="536" y="190" width="220" height="280" rx="16" fill="#E1EAEE" stroke="#D8CDBA" stroke-width="2"/><circle cx="576" cy="232" r="20" fill="#1D1A15"/><text x="576" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="558" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="start">Compare</text><text x="558" y="334.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Practice group</text><text x="558" y="358.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">vs. sham session</text><text x="558" y="383.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">vs. normal class</text><path d="M758 330 L778 330" stroke="#8A5F17" stroke-width="3" marker-end="url(#k)"/><rect x="780" y="190" width="220" height="280" rx="16" fill="#DCE5D3" stroke="#D8CDBA" stroke-width="2"/><circle cx="820" cy="232" r="20" fill="#1D1A15"/><text x="820" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="802" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="start">Measure</text><text x="802" y="334.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Time to mastery,</text><text x="802" y="358.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">recall after 1</text><text x="802" y="383.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">week and 1 month,</text><text x="802" y="408.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">HRV and EEG</text><path d="M1002 330 L1022 330" stroke="#8A5F17" stroke-width="3" marker-end="url(#k)"/><rect x="1024" y="190" width="220" height="280" rx="16" fill="#F0DCCD" stroke="#D8CDBA" stroke-width="2"/><circle cx="1064" cy="232" r="20" fill="#1D1A15"/><text x="1064" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1046" y="296" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#1D1A15" text-anchor="start">Publish</text><text x="1046" y="334.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Open data and</text><text x="1046" y="358.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">results,</text><text x="1046" y="383.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">including null</text><text x="1046" y="408.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">results</text><rect x="48" y="500" width="1204" height="70" rx="12" fill="none" stroke="#5F584C" stroke-width="2" stroke-dasharray="8 6"/><text x="70" y="544" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F584C" text-anchor="start">Frontier, TRL 1–3. Shared learning beyond normal teaching is a hypothesis, not a claim. Consent and opt-out always.</text></svg>