<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="1300" height="900" role="img" aria-label="How energy flows"><title>How energy flows</title><rect width="1300" height="900" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">How energy flows</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">Phase 1 solar microgrid: 2–5 MWp of solar, 8–20 MWh of storage, all proven technology (TRL 8–9)</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A5F17"/></marker></defs><text x="48" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="2">Make</text><rect x="48" y="190" width="330" height="128" rx="14" fill="#FFF6E3" stroke="#D8CDBA" stroke-width="2"/><text x="68" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Roof and facade solar</text><text x="68" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Domes, temple, studios;</text><text x="68" y="282.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">solar glass (BIPV)</text><path d="M378 254 L500 420" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="48" y="340" width="330" height="128" rx="14" fill="#FFF6E3" stroke="#D8CDBA" stroke-width="2"/><text x="68" y="378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Ground and canopy solar</text><text x="68" y="408.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Arrays and shaded parking at</text><text x="68" y="432.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">the edge</text><path d="M378 404 L500 420" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="48" y="490" width="330" height="128" rx="14" fill="#FFF6E3" stroke="#D8CDBA" stroke-width="2"/><text x="68" y="528" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Spire solar crown</text><text x="68" y="558.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">200–500 kWp</text><path d="M378 554 L500 420" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="510" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="2">Store and steer</text><rect x="510" y="300" width="300" height="150" rx="14" fill="#F3ECDF" stroke="#8A5F17" stroke-width="2"/><text x="530" y="338" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Microgrid controller</text><text x="530" y="368.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Balances supply and</text><text x="530" y="392.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">demand; can run islanded</text><rect x="510" y="480" width="300" height="128" rx="14" fill="#E1EAEE" stroke="#D8CDBA" stroke-width="2"/><text x="530" y="518" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Batteries 8–20 MWh</text><text x="530" y="548.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Day-to-night shifting;</text><text x="530" y="572.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">sodium-ion or flow</text><rect x="510" y="190" width="300" height="92" rx="14" fill="#FBF8F2" stroke="#D8CDBA" stroke-width="2"/><text x="530" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Regional grid tie</text><text x="530" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Import / export</text><path d="M660 282 L660 300" stroke="#8A5F17" stroke-width="3"/><path d="M660 450 L660 480" stroke="#8A5F17" stroke-width="3"/><rect x="510" y="640" width="300" height="110" rx="14" fill="#FBF8F2" stroke="#D8CDBA" stroke-width="2"/><text x="530" y="678" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Backup generator</text><text x="530" y="708.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">For long outages only</text><path d="M660 640 L660 612" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="930" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="2">Use</text><rect x="930" y="190" width="322" height="118" rx="14" fill="#DCE5D3" stroke="#D8CDBA" stroke-width="2"/><text x="950" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Homes and domes</text><text x="950" y="258.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">200–500 kW peak per dome</text><path d="M810 375 L925 249" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="930" y="330" width="322" height="118" rx="14" fill="#DCE5D3" stroke="#D8CDBA" stroke-width="2"/><text x="950" y="368" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Food and water</text><text x="950" y="398.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">Greenhouses, pumps,</text><text x="950" y="422.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">treatment</text><path d="M810 375 L925 389" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="930" y="470" width="322" height="118" rx="14" fill="#DCE5D3" stroke="#D8CDBA" stroke-width="2"/><text x="950" y="508" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Studios and workshops</text><text x="950" y="538.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">100–300 kW</text><path d="M810 375 L925 529" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="930" y="610" width="322" height="118" rx="14" fill="#DCE5D3" stroke="#D8CDBA" stroke-width="2"/><text x="950" y="648" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1D1A15" text-anchor="start">Mobility</text><text x="950" y="678.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">E-bikes, shuttles, EV</text><text x="950" y="702.7" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F584C" text-anchor="start">charging</text><path d="M810 375 L925 669" stroke="#8A5F17" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="48" y="790" width="1204" height="60" rx="12" fill="none" stroke="#5F584C" stroke-width="2" stroke-dasharray="8 6"/><text x="70" y="829" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#5F584C" text-anchor="start">Subtle-energy research is a separate track: measured on its own, it never powers anything.</text></svg>