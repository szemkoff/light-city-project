<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img" aria-label="Golden ratio"><title>Golden ratio</title><rect width="1300" height="720" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">Golden ratio</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">A rectangle whose sides are in the ratio 1 : 1.618, divided into squares</text><rect x="70" y="230" width="560" height="346.1" fill="none" stroke="#5F584C" stroke-width="2"/><rect x="70.0" y="230.0" width="346.1" height="346.1" fill="none" stroke="#D8CDBA" stroke-width="2"/><rect x="416.1" y="230.0" width="213.9" height="213.9" fill="none" stroke="#D8CDBA" stroke-width="2"/><rect x="497.8" y="443.9" width="132.2" height="132.2" fill="none" stroke="#D8CDBA" stroke-width="2"/><rect x="416.1" y="494.4" width="81.7" height="81.7" fill="none" stroke="#D8CDBA" stroke-width="2"/><rect x="416.1" y="443.9" width="50.5" height="50.5" fill="none" stroke="#D8CDBA" stroke-width="2"/><rect x="466.6" y="443.9" width="31.2" height="31.2" fill="none" stroke="#D8CDBA" stroke-width="2"/><rect x="478.5" y="475.1" width="19.3" height="19.3" fill="none" stroke="#D8CDBA" stroke-width="2"/><rect x="466.6" y="482.5" width="11.9" height="11.9" fill="none" stroke="#D8CDBA" stroke-width="2"/><path d="M70 576.1 A346.1 346.1 0 0 1 416.1 230.0 A213.9 213.9 0 0 1 630.0 443.9 A132.2 132.2 0 0 1 497.8 576.1 A81.7 81.7 0 0 1 416.1 494.4 A50.5 50.5 0 0 1 466.6 443.9 A31.2 31.2 0 0 1 497.8 475.1 A19.3 19.3 0 0 1 478.5 494.4 A11.9 11.9 0 0 1 466.6 482.5" fill="none" stroke="#8A5F17" stroke-width="5" stroke-linecap="round"/><text x="70" y="650" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" fill="#8A5F17" text-anchor="start">φ ≈ 1.618</text><rect x="680" y="170" width="572" height="230" rx="16" fill="#F3ECDF"/><text x="708" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="1.5">Traditional meaning</text><text x="708" y="252.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">Admired since ancient Greece as a harmonious</text><text x="708" y="279.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">proportion. Many plant spirals, such as</text><text x="708" y="306.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">sunflower seed heads, follow the related</text><text x="708" y="333.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">Fibonacci numbers.</text><rect x="680" y="420" width="572" height="230" rx="16" fill="#DCE5D3"/><text x="708" y="464" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6E8B6A" text-anchor="start" letter-spacing="1.5">How Light City uses it</text><text x="708" y="502.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">A proportion guide for room shapes, window</text><text x="708" y="529.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">rhythm and the spacing of rings. Used as one</text><text x="708" y="556.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">tool among many, not a rule.</text></svg>