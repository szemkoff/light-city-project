<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img" aria-label="Vesica piscis"><title>Vesica piscis</title><rect width="1300" height="720" rx="18" fill="#FBF8F2"/><text x="48" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="400" fill="#1D1A15" text-anchor="start">Vesica piscis</text><text x="48" y="114" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5F584C" text-anchor="start">Two equal circles, each passing through the other’s center</text><circle cx="265.0" cy="430" r="150" fill="#E1EAEE" fill-opacity=".6" stroke="#1D1A15" stroke-width="3"/><circle cx="415.0" cy="430" r="150" fill="#F6D38C" fill-opacity=".55" stroke="#8A5F17" stroke-width="3"/><line x1="340" y1="300.1" x2="340" y2="559.9" stroke="#B5643C" stroke-width="3" stroke-dasharray="8 6"/><line x1="265.0" y1="430" x2="415.0" y2="430" stroke="#1D1A15" stroke-width="2"/><text x="340" y="630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#5F584C" text-anchor="middle">height : width = √3 : 1</text><rect x="680" y="170" width="572" height="230" rx="16" fill="#F3ECDF"/><text x="708" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#8A5F17" text-anchor="start" letter-spacing="1.5">Traditional meaning</text><text x="708" y="252.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">An ancient symbol of meeting and creation,</text><text x="708" y="279.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">common in medieval church art and window</text><text x="708" y="306.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">tracery.</text><rect x="680" y="420" width="572" height="230" rx="16" fill="#DCE5D3"/><text x="708" y="464" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#6E8B6A" text-anchor="start" letter-spacing="1.5">How Light City uses it</text><text x="708" y="502.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">The geometry of the pointed arch: used for</text><text x="708" y="529.3" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">doorways, garden gates and window heads, and</text><text x="708" y="556.6" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1D1A15" text-anchor="start">for shared spaces where paths meet.</text></svg>