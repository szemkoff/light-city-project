<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light City 3D reference model</title>
<style>
  html, body { margin: 0; height: 100%; background: #FBF8F2; font: 15px/1.4 system-ui, sans-serif; color: #1D1A15; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  .ui h1 { pointer-events: auto; font: 600 16px/1.2 Georgia, serif; margin: 0 8px 0 0; background: rgba(251,248,242,.9); padding: 8px 10px; border-radius: 8px; }
  .ui button { pointer-events: auto; border: 1px solid #D8CDBA; background: rgba(251,248,242,.92); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .ui button[aria-pressed="true"], .ui button[aria-checked="true"] { background: #1D1A15; color: #FBF8F2; }
  #phases { display: inline-flex; gap: 6px; margin-right: 10px; }
  #phases button { border-color: #C9A24A; }
  .note { position: fixed; left: 12px; bottom: 12px; right: 12px; max-width: 640px; background: rgba(251,248,242,.92); padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #5F584C; }
  body.render .ui, body.render .note { display: none; }
</style>
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c" aria-label="3D model of the Light City plan"></canvas>
<div class="ui"><h1><span id="ttl">Light City reference model</span> · <a href="../docs/design/visual-language/#3d-reference-model" style="color:inherit;font-weight:400;pointer-events:auto">About</a></h1><span id="phases" role="radiogroup" aria-label="Phase"></span><span id="views"></span></div>
<p class="note" id="note"></p>
<script type="module">
  import {start, VIEWS, PHASES} from './city.js';
  const q = new URLSearchParams(location.search);
  const phase = [1, 2, 3].includes(+q.get('phase')) ? +q.get('phase') : 1;
  const NOTES = {
    1: 'Phase 1, pilot hamlet: 200 residents on a 20–30 acre core. A 90 m spire, one temple and two learning pavilions, three 40 m domes, 30 earth homes on ring 4 and solar on ring 5. Empty dome plots are orchards.',
    2: 'Phase 2, village: about 1,500 residents on roughly 160 acres. The spire is extended to 150 m, six pavilions, eight domes (five new at 52 m), 48 homes on ring 4, a new ring of earth-home courtyard clusters and a food and energy belt with agrivoltaics, greenhouses and food forest.',
    3: 'Phase 3, town: 8,000+ residents on about one square mile. A 240 m spire, eight pavilions, all twelve ring domes, six 80 m district domes each with a small temple, crescents of two-to-three storey timber terraces with green roofs and a wide food and energy belt. Schematic, not a final master plan.',
  };
  document.getElementById('ttl').textContent = 'Light City, ' + PHASES[phase].name;
  document.getElementById('note').textContent = NOTES[phase] + ' Drag to orbit, scroll or pinch to zoom.';
  const pb = document.getElementById('phases');
  for (const n of [1, 2, 3]) {
    const b = document.createElement('button');
    b.textContent = 'Phase ' + n; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', n === phase);
    b.onclick = () => { const u = new URLSearchParams(location.search); u.set('phase', n); location.search = u.toString(); };
    pb.appendChild(b);
  }
  const render = q.has('render');
  if (render) document.body.classList.add('render');
  const c = document.getElementById('c');
  if (render) { c.style.width = q.get('w') + 'px'; c.style.height = q.get('h') + 'px'; }
  const app = start(c, {phase, interactive: !render, view: q.get('view') || 'aerial', width: render ? +q.get('w') : 0, height: render ? +q.get('h') : 0});
  const box = document.getElementById('views');
  for (const [k, v] of Object.entries(VIEWS)) {
    const b = document.createElement('button');
    b.textContent = v.label; b.setAttribute('aria-pressed', k === (q.get('view') || 'aerial'));
    b.onclick = () => { app.setView(k); box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    box.appendChild(b);
  }
  window.__ready = true;
</script>
</body>
</html>
