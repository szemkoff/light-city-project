<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light City 3D reference model</title>
<style>
  html, body { margin: 0; height: 100%; background: #FBF8F2; font: 15px/1.4 system-ui, sans-serif; color: #1D1A15; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  .ui h1 { pointer-events: auto; font: 600 16px/1.2 Georgia, serif; margin: 0 8px 0 0; background: rgba(251,248,242,.9); padding: 8px 10px; border-radius: 8px; }
  .ui button { pointer-events: auto; border: 1px solid #D8CDBA; background: rgba(251,248,242,.92); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .ui button[aria-pressed="true"], .ui button[aria-checked="true"] { background: #1D1A15; color: #FBF8F2; }
  #phases { display: inline-flex; gap: 6px; margin-right: 10px; }
  #phases button { border-color: #C9A24A; }
  .note { position: fixed; left: 12px; bottom: 12px; right: 12px; max-width: 640px; background: rgba(251,248,242,.92); padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #5F584C; }
  body.render .ui, body.render .note { display: none; }
</style>
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c" aria-label="3D model of the Light City plan"></canvas>
<div class="ui"><h1><span id="ttl">Light City reference model</span> · <a href="../docs/design/visual-language/#3d-reference-model" style="color:inherit;font-weight:400;pointer-events:auto">About</a></h1><span id="phases" role="radiogroup" aria-label="Phase"></span><span id="views"></span><span id="time" role="radiogroup" aria-label="Time of day" style="margin-left:10px;display:inline-flex;gap:6px"></span></div>
<p class="note" id="note"></p>
<script type="module">
  import {start, VIEWS, PHASES} from './city.js';
  const q = new URLSearchParams(location.search);
  const phase = [1, 2, 3].includes(+q.get('phase')) ? +q.get('phase') : 1;
  const NOTES = {
    1: 'Phase 1, pilot hamlet: 200 residents on a 20–30 acre core. A 90 m spire of three lattice sections on a foundation built for the final height, one temple and two learning pavilions, three 40 m domes, 30 earth homes on ring 4 and solar on ring 5. Reserved dome plots are meadow and tree nursery. A heart lake to the south-west joins the plaza by a canal, harbour and rill; low hills shelter the north; cars stop at a solar mobility hub on the north road. Paths turn in a gentle spiral. Utilities sit behind the city in the northern woods, and a treatment wetland cleans the water where the creek meets the river.',
    2: 'Phase 2, village: about 1,500 residents on roughly 160 acres. Everything from Phase 1 stays; this view turns on what Phase 2 adds. The spire gains two sections (150 m), three more pavilions, five new 52 m domes on reserved plots, 24 more homes in the ring 4 gaps, a new ring of earth-home courtyard clusters and a food and energy belt. Beyond the core the radial paths turn gently; three work hubs and three mobility hubs sit within a few minutes of every home.',
    3: 'Phase 3, town: 8,000+ residents on about 1.2 square miles. The village and its food and energy belt stay as built, now a green belt; this view turns on what Phase 3 adds. The spire reaches 240 m, the last four ring domes and two pavilions fill reserved plots, and outside the green belt come timber terraces with green roofs, six 80 m district domes and a new outer belt, with market halls and workshops in every district, a ring road with mobility hubs, and a slow river bending round the south. Schematic, not a final master plan.',
  };

  let app;
  const pb = document.getElementById('phases');
  const showPhase = (n) => {
    document.getElementById('ttl').textContent = 'Light City, ' + PHASES[n].name;
    document.getElementById('note').textContent = NOTES[n] + ' Drag to orbit, scroll or pinch to zoom.';
    pb.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-checked', i + 1 === n));
  };
  for (const n of [1, 2, 3]) {
    const b = document.createElement('button');
    b.textContent = 'Phase ' + n; b.setAttribute('role', 'radio');
    b.title = n === 1 ? 'Phase 1 only' : 'Turn on the structures Phase ' + n + ' adds';
    b.onclick = () => {
      app.setPhase(n); showPhase(n);
      const u = new URLSearchParams(location.search); u.set('phase', n); history.replaceState(null, '', '?' + u);
    };
    pb.appendChild(b);
  }
  const render = q.has('render');
  if (render) document.body.classList.add('render');
  const c = document.getElementById('c');
  if (render) { c.style.width = q.get('w') + 'px'; c.style.height = q.get('h') + 'px'; }
  const time = q.get('time') === 'night' ? 'night' : 'day';
  app = start(c, {phase, time, interactive: !render, view: q.get('view') || 'aerial', width: render ? +q.get('w') : 0, height: render ? +q.get('h') : 0});
  showPhase(phase);
  const box = document.getElementById('views');
  // Three view buttons for visitors; the other views stay available by URL (?view=) for reference renders.
  const BUTTONS = {aerial: 'Aerial', top: 'Plan', plaza: 'Street level'};
  for (const [k, label] of Object.entries(BUTTONS)) {
    const b = document.createElement('button');
    b.textContent = label; b.title = VIEWS[k].label; b.setAttribute('aria-pressed', k === (q.get('view') || 'aerial'));
    b.onclick = () => { app.setView(k); box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
    box.appendChild(b);
  }
  // Day and night toggle; the choice is kept in the URL (?time=night)
  const tb = document.getElementById('time');
  for (const [k, label] of [['day', 'Day'], ['night', 'Night']]) {
    const b = document.createElement('button');
    b.textContent = label; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', k === time);
    b.onclick = () => {
      app.setTime(k); tb.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b));
      const u = new URLSearchParams(location.search); if (k === 'night') u.set('time', 'night'); else u.delete('time'); history.replaceState(null, '', '?' + u);
    };
    tb.appendChild(b);
  }
  window.__ready = true;
</script>
</body>
</html>
