<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light City 3D reference model</title>
<style>
  html, body { margin: 0; height: 100%; background: #FBF8F2; font: 15px/1.4 system-ui, sans-serif; color: #1D1A15; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  .ui h1 { pointer-events: auto; font: 600 16px/1.2 Georgia, serif; margin: 0 8px 0 0; background: rgba(251,248,242,.9); padding: 8px 10px; border-radius: 8px; }
  .ui button { pointer-events: auto; border: 1px solid #D8CDBA; background: rgba(251,248,242,.92); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .ui button[aria-pressed="true"], .ui button[aria-checked="true"] { background: #1D1A15; color: #FBF8F2; }
  .ctl { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(251,248,242,.92); border: 1px solid #D8CDBA; border-radius: 999px; padding: 2px 4px 2px 12px; }
  .ctl span { font-size: 12px; color: #5F584C; text-transform: uppercase; letter-spacing: .04em; }
  .ctl select { font: inherit; color: inherit; border: 0; background: transparent; padding: 5px 22px 5px 4px; cursor: pointer; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #5F584C 50%), linear-gradient(135deg, #5F584C 50%, transparent 50%);
    background-position: calc(100% - 11px) 52%, calc(100% - 6px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .ctl select:focus-visible { outline: 2px solid #C9A24A; border-radius: 6px; }
  .ctl.phase { border-color: #C9A24A; }
  .note { position: fixed; left: 12px; bottom: 12px; max-width: min(640px, calc(100vw - 24px)); background: rgba(251,248,242,.92); padding: 0; border-radius: 8px; font-size: 13px; color: #5F584C; }
  .note summary { cursor: pointer; list-style: none; padding: 7px 12px; display: flex; gap: 8px; align-items: baseline; }
  .note summary::-webkit-details-marker { display: none; }
  .note summary::after { content: 'More'; margin-left: auto; padding-left: 8px; font-size: 12px; font-weight: 600; color: #8A6A1F; white-space: nowrap; }
  .note[open] summary::after { content: 'Less'; }
  .note summary:focus-visible { outline: 2px solid #C9A24A; border-radius: 8px; }
  .note #noteSum { color: #1D1A15; }
  .note p { margin: 0; padding: 0 12px 9px; max-height: 40vh; overflow: auto; }
  .card { position: fixed; z-index: 5; width: 300px; max-width: calc(100vw - 24px); background: rgba(251,248,242,.97); border: 1px solid #D8CDBA; border-radius: 10px; padding: 12px 14px 12px; box-shadow: 0 6px 24px rgba(29,26,21,.18); font-size: 14px; }
  .card[hidden] { display: none; }
  .card h2 { font: 600 16px/1.25 Georgia, serif; margin: 0 26px 4px 0; }
  .card .ph { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #8A6A1F; border: 1px solid #C9A24A; border-radius: 999px; padding: 1px 8px; margin-bottom: 6px; }
  .card p { margin: 0 0 8px; color: #3F3A31; }
  .card a { color: #1D1A15; font-weight: 600; }
  .card .x { position: absolute; right: 6px; top: 6px; border: 0; background: none; font: 20px/1 system-ui, sans-serif; color: #5F584C; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .card .x:focus-visible, .card a:focus-visible { outline: 2px solid #C9A24A; }
  @media (max-width: 600px) { .card { left: 12px !important; right: 12px; top: auto !important; bottom: 12px; width: auto; } }
  body.render .ui, body.render .note, body.render .card { display: none; }
</style>
<script type="importmap">{"imports": {"three": "./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c" aria-label="3D model of the Light City plan"></canvas>
<div class="ui"><h1><span id="ttl">Light City reference model</span> · <a href="../docs/design/visual-language/#3d-reference-model" style="color:inherit;font-weight:400;pointer-events:auto">About</a></h1><label class="ctl phase"><span>Phase</span><select id="phaseSel" aria-label="Phase"></select></label><label class="ctl"><span>View</span><select id="viewSel" aria-label="View"></select></label><label class="ctl"><span>Time</span><select id="timeSel" aria-label="Time of day"></select></label></div>
<details class="note" id="noteBox"><summary><span id="noteSum"></span></summary><p id="note"></p></details>
<div class="card" id="card" role="dialog" aria-live="polite" aria-labelledby="cardT" hidden><button class="x" id="cardX" aria-label="Close">×</button><h2 id="cardT"></h2><span class="ph" id="cardP"></span><p id="cardD"></p><a id="cardL" target="_blank" rel="noopener">Read the full description →</a></div>
<script type="module">
  import {start, VIEWS, PHASES} from './city.js';
  import {INFO} from './info.js';
  const q = new URLSearchParams(location.search);
  const phase = [1, 2, 3].includes(+q.get('phase')) ? +q.get('phase') : 1;
  const NOTES = {
    1: 'Phase 1, pilot hamlet: 200 residents on a 20–30 acre core. A 90 m spire of three lattice sections on a foundation built for the final height, one temple and two learning pavilions, three 40 m domes, 30 earth homes on ring 4 and solar on ring 5. Reserved dome plots are meadow and tree nursery. A heart lake to the south-west joins the plaza by a canal, harbour and rill; low hills shelter the north; cars stop at a solar mobility hub on the north road. Paths turn in a gentle spiral. Utilities sit behind the city in the northern woods, and a treatment wetland cleans the water where the creek meets the river.',
    2: 'Phase 2, village: about 1,500 residents on roughly 160 acres. Everything from Phase 1 stays; this view turns on what Phase 2 adds. The spire gains two sections (150 m), three more pavilions, five new 52 m domes on reserved plots, 24 more homes in the ring 4 gaps, a new ring of earth-home courtyard clusters and a food and energy belt. The paths turn in a gentle spiral; three work hubs and three mobility hubs sit within a few minutes of every home.',
    3: 'Phase 3, town: 8,000+ residents on about 1.2 square miles. The village and its food and energy belt stay as built, now a green belt; this view turns on what Phase 3 adds. The spire reaches 240 m, the last four ring domes and two pavilions fill reserved plots, and outside the green belt come timber terraces with green roofs, six 80 m district domes and a new outer belt, with market halls and workshops in every district, a ring road with mobility hubs, and a slow river bending round the south. Schematic, not a final master plan.',
  };

  let app;
  const setQ = (k, v) => { const u = new URLSearchParams(location.search); if (v == null) u.delete(k); else u.set(k, v); history.replaceState(null, '', '?' + u); };
  const opt = (sel, value, label, title) => { const o = document.createElement('option'); o.value = value; o.textContent = label; if (title) o.title = title; sel.appendChild(o); return o; };
  const ps = document.getElementById('phaseSel');
  const PHASE_LABELS = {1: '1 · Pilot hamlet', 2: '2 · Village', 3: '3 · Town'};
  for (const n of [1, 2, 3]) opt(ps, n, PHASE_LABELS[n], n === 1 ? 'Phase 1 only' : 'Turn on the structures Phase ' + n + ' adds');
  const showPhase = (n) => {
    document.getElementById('ttl').textContent = 'Light City, ' + PHASES[n].name;
    const cut = NOTES[n].indexOf('. ') + 1;
    document.getElementById('noteSum').textContent = NOTES[n].slice(0, cut);
    document.getElementById('note').textContent = NOTES[n].slice(cut).trim() + ' Drag to orbit, scroll or pinch to zoom, and fly with the arrow keys or WASD (hold Shift to go faster). Click or tap a building to see what it is.';
    ps.value = n;
  };
  let curPhase = phase;
  const goPhase = (n) => { curPhase = n; app.setPhase(n); showPhase(n); setQ('phase', n); };
  ps.onchange = () => goPhase(+ps.value);
  const render = q.has('render');
  if (render) document.body.classList.add('render');
  const c = document.getElementById('c');
  if (render) { c.style.width = q.get('w') + 'px'; c.style.height = q.get('h') + 'px'; }
  const time = q.get('time') === 'night' ? 'night' : 'day';
  app = start(c, {phase, time, interactive: !render, view: q.get('view') || 'aerial', width: render ? +q.get('w') : 0, height: render ? +q.get('h') : 0});
  showPhase(phase);
  // Views grouped by theme. A view that only exists in a later phase switches the phase up to it.
  const GROUPS = [
    ['Overview', [['aerial', 'Aerial'], ['top', 'Plan from above'], ['hero', 'Low aerial from the west'], ['water', 'Lake, creek and river']]],
    ['Centre', [['plaza', 'Street level at the plaza'], ['heart', 'Along the heart rill'], ['path', 'On a spiral path'], ['homes', 'Homes ring'], ['solar', 'Solar ring'], ['entrances', 'Dome entrances'], ['builds', 'Four ways to build a home'], ['courtyards', 'Courtyard clusters'], ['dome', 'Inside a communosphere']]],
    ['Water and boats', [['lake', 'Heart canal and lake'], ['harbour', 'Harbour crescent'], ['canal', 'Canal quay', 3]]],
    ['Living and work', [['hub', 'Mobility hub'], ['work', 'Neighbourhood work hub', 2], ['terracesAir', 'Above the terraces', 3], ['terraces', 'Between the terraces', 3]]],
    ['Infrastructure', [['utilities', 'Utility campus'], ['watermouth', 'Water mouth and wetland']]],
  ];
  const vs = document.getElementById('viewSel');
  const MINP = {};
  for (const [g, items] of GROUPS) {
    const og = document.createElement('optgroup'); og.label = g; vs.appendChild(og);
    for (const [k, label, minP] of items) { if (!VIEWS[k]) continue; MINP[k] = minP || 1; opt(og, k, label + (minP ? ' (Phase ' + minP + ')' : ''), VIEWS[k].label); }
  }
  const startView = VIEWS[q.get('view')] ? q.get('view') : 'aerial';
  if (!MINP[startView]) opt(vs, startView, VIEWS[startView].label);
  vs.value = startView;
  vs.onchange = () => {
    const k = vs.value;
    if ((MINP[k] || 1) > curPhase) goPhase(MINP[k]);
    app.setView(k); setQ('view', k === 'aerial' ? null : k);
  };
  // Day and night; the choice is kept in the URL (?time=night)
  const ts = document.getElementById('timeSel');
  opt(ts, 'day', 'Day'); opt(ts, 'night', 'Night'); ts.value = time;
  ts.onchange = () => { app.setTime(ts.value); setQ('time', ts.value === 'night' ? 'night' : null); };
  // Hand the arrow keys back to flying once a menu choice is made
  for (const s of [ps, vs, ts]) s.addEventListener('change', () => s.blur());
  // Click or tap a structure to see what it is; a drag (orbit) does not count as a click
  const card = document.getElementById('card');
  const hideCard = () => { card.hidden = true; };
  document.getElementById('cardX').onclick = hideCard;
  addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCard(); });
  let down = null;
  c.addEventListener('pointerdown', (e) => { down = {x: e.clientX, y: e.clientY, t: performance.now()}; });
  c.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 700) { down = null; return; }
    down = null;
    const r = c.getBoundingClientRect();
    const hit = app.pick(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    const it = hit && INFO[hit.key];
    if (!it) { hideCard(); return; }
    document.getElementById('cardT').textContent = it.title;
    document.getElementById('cardP').textContent = hit.from > 1 ? 'Added in Phase ' + hit.from : 'Built in Phase 1';
    document.getElementById('cardD').textContent = it.text;
    const a = document.getElementById('cardL'); a.href = it.link; a.hidden = !it.link;
    card.hidden = false;
    const w = card.offsetWidth, h = card.offsetHeight;
    card.style.left = Math.max(12, Math.min(innerWidth - w - 12, e.clientX + 14)) + 'px';
    card.style.top = Math.max(60, Math.min(innerHeight - h - 12, e.clientY - h / 2)) + 'px';
  });
  window.__app = app;
  window.__ready = true;
</script>
</body>
</html>
