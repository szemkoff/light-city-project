name: Deploy Docusaurus to GitHub Pages

# Matches repo Settings → Pages: "Deploy from a branch" → gh-pages / (root).
# Pushes website/build to the gh-pages branch so the live site and hashed assets stay in sync.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd website && npm ci --legacy-peer-deps

      - name: Build site
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: cd website && npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          B="website/build"
          test -f "$B/index.html"
          test -n "$(ls -1 "$B/assets/css"/styles.*.css 2>/dev/null | head -1)"
          test -n "$(ls -1 "$B/assets/js"/runtime~main.*.js 2>/dev/null)"
          test -n "$(ls -1 "$B/assets/js"/main.*.js 2>/dev/null)"
          echo "OK: index.html and asset bundles present under $B"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: update site from main'
