name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    concurrency:
      group: pages
      cancel-in-progress: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: cd website && npm install --legacy-peer-deps
      
      - name: Build site
        run: cd website && npm run build

      # Ensures HTML and hashed bundles stay in sync (avoids “site did not load” when JS/CSS 404)
      - name: Verify build output
        run: |
          set -euo pipefail
          B="website/build"
          test -f "$B/index.html"
          test -n "$(ls -1 "$B/assets/css"/styles.*.css 2>/dev/null | head -1)"
          test -n "$(ls -1 "$B/assets/js"/runtime~main.*.js 2>/dev/null)"
          test -n "$(ls -1 "$B/assets/js"/main.*.js 2>/dev/null)"
          echo "OK: index.html and asset bundles present under $B"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/build'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

